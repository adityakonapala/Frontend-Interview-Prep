<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya's Bank</title>
</head>

<body>
    <header>
        <center>
            <h1 style="color: blue;">
                Aditya's <span style="color: gold;">Bank</span>
            </h1>


            <nav>
                <a href="index.html">Home</a> |
                <a href="loans.html">Loans</a> |
                <a href="branches.html">Branches</a> |
                <a href="Cust-reg-form.html">Customer Registration</a> |
                 <a href="Login-form.html">Login</a> |
                 <a href="Emi-Calculater.html">EMI Calculator</a> |
                  <a href="Cust-Pof-Update.html">Update Profile</a> |
                    <a href="Branch-feedback.html">Branch Feedback</a>
            </nav>
        </center>
    </header>
    <hr>
    <main>
         <center>
            <h3>Welcome to Aditya's Bank</h3>
        </center>
        <table border="1" align="center" cellpadding="5" cellspacing="4">
            <caption>Customer Registration Form</caption>
            <tbody>
                <form action="" method="post">
                    <tr>
                        <td><label for="name">Customer Name </label></td>
                        <td> <input id="name" type="text"></td>
                    </tr>

                    <tr>
                        <td> <label for="password">Password</label></td>
                        <td><input id="password" type="password"></td>
                    </tr>
                    <tr>
                        <td> <label for="confirm-password">Confirm Password</label>
                        </td>
                        <td> <input id="confirm-password" type="password"></td>
                    </tr>
                    <tr>
                        <td> <label for="email">Email</label></td>
                        <td> <input id="email" type="email"></td>
                    </tr>
                    <tr>
                        <td> <label for="phone">Phone</label></td>
                        <td> <input id="phone" type="tel"></td>
                    </tr>
                    <tr>
                        <td> <label for="dob">Date of Birth</label></td>
                        <td> <input id="dob" type="date"></td>
                    </tr>
                    <tr>
                        <td> <label for="gender">Gender</label></td>
                        <td> <input id="male" type="radio" name="gender" value="male"><label for="male">male</label>
                            <input id="female" type="radio" name="gender" value="female"><label for="female">female</label>
                            <input id="other" type="radio" name="gender" value="other"><label for="other">other</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="account">Account Type</label></td>
                        <td><select name="account" id="account">
                                <option value="">--select--</option>
                                <option value="savings">Savings</option>
                                <option value="current">Current</option>
                            </select></td>
                    </tr>

                    <tr>
                        <td> <label for="aadhar">Aadhar Number</label>
                        </td>
                        <td> <input id="aadhar" type="number"></td>
                    </tr>

                    <tr>
                        <td> <label for="pan">Pan</label>
                        </td>
                        <td> <input id="pan" type="file"></td>
                    </tr>

                    <tr>
                        <td> <label for="address">Address</label></td>
                        <td> <textarea name="address" id="address" cols="20" rows="8"></textarea></td>
                    </tr>

                    <tr>
                        <td><label for="terms">Terms and Conditions</label></td>
                        <td> <input id="terms" type="checkbox"> I Agree</td>
                    </tr>

                    <tr >
                        <td colspan="2" align="center"><input type="submit"> <input type="reset"></td>
                    </tr>

                </form>
            </tbody>
        </table>
    </main>

    <footer style="background-color: black ; height: 125px;">
        <center>
            <h5 style="color: white">Copyright © 2023 Aditya's Bank. All rights reserved.</h5>
        </center>
    </footer>
</body>

</html>
