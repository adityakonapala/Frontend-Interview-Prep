<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

</head>

<body>
    <header>
        <center>
            <h1 style="color: blue;">
                Aditya's <span style="color: gold;">Bank</span>
            </h1>


            <nav>
                <a href="index.html">Home</a> |
                <a href="loans.html">Loans</a> |
                <a href="branches.html">Branches</a> |
                 <a href="Cust-reg-form.html">Customer Registration</a> |

                     <a href="Cust-Pof-Update.html">Update Profile</a> |
                        <a href="Branch-feedback.html">Branch Feedback</a>
            </nav>
        </center>
    </header>
    <hr>
    <main style="height: 500px;">
        <center>
            <h3>Welcome to Aditya's Bank</h3>
        </center>
         <table border="1" align="center" cellpadding="5" cellspacing="5"> 
            <caption>EMI Calculator</caption>
            <form action="" method="post">  
                <tr>
                    <td><label for="loan-amount">Loan Amount</label></td>
                    <td><input id="loan-amount" type="number"></td>
                </tr>
                <tr>
                    <td><label for="interest-rate">Interest Rate (%)</label></td>
                    <td><input id="interest-rate" type="number" step="0.01"></td>
                </tr>
                <tr>
                    <td><label for="loan-tenure">Loan Tenure (in months)</label></td>
                    <td><input id="loan-tenure" type="number"></td>
                </tr>
                <tr>
                    <td><label for="tenure-type">Tenure Type</label></td>
                    <td>
                        <select name="tenure-type" id="tenure-type">  
                            <option value="Monthly">Monthly</option>
                            <option value="Yearly">Yearly</option>
                            <option value="Weekly">Weekly</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="emi-start-date">EMI Start date </label></td>
                    <td><input id="emi-start-date" type="date"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Calculate EMI">
                        <input type="reset">
                    </td>
                </tr>
            </form>
        </table>
    </main>

    <footer style="background-color: black ; height: 125px;">
        <center>
            <h5 style="color: white">Copyright © 2023 Aditya's Bank. All rights reserved.</h5>
        </center>
    </footer>
</body>

</html>
