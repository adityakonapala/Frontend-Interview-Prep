    <main style="height: 550px;">
         <center>
            <h3>Welcome to Aditya's Bank</h3>
        </center>
        <table border="1" align="center" cellpadding="5" cellspacing="4">
            <caption>Customer Profile Update</caption>
            <tbody>
                <form action="" method="post" >
                    <tr>
                        <td><label for="name">Customer Name </label></td>
                        <td> <input id="name" type="text"></td>
                    </tr>

                   
                    <tr>
                        <td> <label for="email">Email</label></td>
                        <td> <input id="email" type="email"></td>
                    </tr>
                    <tr>
                        <td> <label for="phone">Mobile</label></td>
                        <td> <input id="phone" type="tel"></td>
                    </tr>
                    <tr>
                        <td><label for="website"> Website </label></td>
                        <td><input id="website" type="text"></td>
                    </tr>
                   
                    <tr>
                        <td> <label for="profile-pic">Profile Picture</label>
                        </td>
                        <td> <input id="profile-pic" type="file"></td>
                    </tr>
                    <tr>
                        <td> <label for="city">City</label>
                        </td>
                        <td> <select name="city" id="city"> 
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Vishakapatnam">Vishakapatnam</option>
                            <option value="Srikakulam">Srikakulam</option>
                        </select></td>
                    </tr>
                          <tr>
                        <td> <label for="dob">Date of Birth</label></td>
                        <td> <input id="dob" type="date"></td>
                    </tr>
                    

                    <tr>
                        <td> <label for="address">Address</label></td>
                        <td> <textarea name="address" id="address" cols="20" rows="8"></textarea></td>
                    </tr>

                    

                    <tr >
                        <td colspan="2" align="center"><input type="submit"></td>
                    </tr>

                </form>
            </tbody>
        </table>
    </main>
